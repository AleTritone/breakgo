<!doctype html><html lang="it"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f4faff;color:#12365b;font:13px system-ui,Segoe UI,sans-serif}.hint{font-size:12px;color:#5e7893;padding:4px 6px 10px}.board{display:flex;flex-flow:row nowrap;align-items:flex-start;gap:12px;width:100%;height:710px;overflow-x:auto;overflow-y:hidden;padding:3px 5px 18px}.lane{flex:0 0 245px;width:245px;min-width:245px;max-width:245px;max-height:675px;display:flex;flex-direction:column;background:#e7f2fb;border:1px solid #bdd7ea;border-radius:12px;padding:8px}.head{display:flex;justify-content:space-between;gap:8px;background:#d2e8f9;padding:10px;border-radius:8px;font-weight:700}.cards{overflow-y:auto;min-height:42px;padding:6px 1px;flex:1}.card{background:#fff;border:1px solid #c2d9e9;border-left:3px solid #168dd0;border-radius:7px;padding:8px;margin:0 0 7px;cursor:grab;user-select:none}.card.locked{border-left-color:#d49a28}.card.dragging{opacity:.4}.time{font-size:11px;font-weight:700;color:#4a718e}.name{font-size:12px;font-weight:650;margin-top:4px;overflow-wrap:anywhere}.meta{font-size:10px;color:#607d94;margin-top:3px;overflow-wrap:anywhere}.cards.over{background:#c9e7fa;border-radius:8px}.add{border:1px dashed #8ebddd;background:white;border-radius:7px;color:#11649e;padding:9px;text-align:left;font-weight:650;cursor:pointer;width:100%}.editor{margin-top:8px;background:white;border:1px solid #aacde5;border-radius:8px;padding:9px;display:none;flex-direction:column;gap:7px}.editor.open{display:flex}.editor input,.editor select,.editor textarea{width:100%;border:1px solid #a8c9df;border-radius:5px;background:#fff;color:#173c60;padding:7px;font:12px system-ui}.editor label{font-size:11px;color:#4c718f}.editor .row{display:flex;gap:6px}.editor .row>div{flex:1;min-width:0}.editor button{border:0;border-radius:6px;background:#168dd0;color:white;padding:9px;cursor:pointer}.editor .cancel{background:#e4edf5;color:#345}.feedback{color:#b33;font-size:11px}

/* SEZIONE: Bacheca sempre chiara, anche in modalita scura del telefono */
:root { color-scheme: light !important; }
html, body { background: #FFFFFF !important; color: #10345C !important; }
.hint { color: #436583 !important; background: #FFFFFF !important; }
.board { background: #FFFFFF !important; }
.lane { background: #EAF5FD !important; border-color: #BBD9ED !important; color: #10345C !important; }
.head { background: #D2E8F9 !important; color: #10345C !important; }
.cards { color: #10345C !important; }
.card { background: #FFFFFF !important; color: #10345C !important; border-color: #C2D9E9 !important; border-left-color: #168DD0 !important; }
.card.locked { border-left-color: #D49A28 !important; }
.time, .meta { color: #4A718E !important; }
.name { color: #10345C !important; }
.add, .editor { background: #FFFFFF !important; color: #11649E !important; }
.editor label { color: #345C7B !important; }
.editor input, .editor select, .editor textarea { background: #FFFFFF !important; color: #173C60 !important; color-scheme: light !important; }
.editor button { background: #168DD0 !important; color: #FFFFFF !important; }
.editor button.cancel { background: #E4EDF5 !important; color: #345 !important; }
@media (prefers-color-scheme: dark) {
  html, body, .board { background: #FFFFFF !important; color: #10345C !important; }
}
</style></head><body><div class="hint">Trascina una scheda e rilasciala nella colonna desiderata. Le assegnazioni manuali rimangono bloccate.</div><div class="board" id="board"></div><script>
const root=document.getElementById('board');let columns=[];let clients=[];let dragId=null;let lastEvent='';
function send(payload){const nonce=Date.now().toString()+'-'+Math.random().toString(36).slice(2);window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',dataType:'json',value:{...payload,nonce}},'*')}
function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function form(lane){let box=el('form','editor');let options=lane.id?'<option value="Ritiro magazzino">Ritiro magazzino</option><option value="Pausa">Pausa</option><option value="Corso / formazione">Corso / formazione</option><option value="Altro impegno">Altro impegno</option>':'<option value="Nuovo appuntamento">Nuovo appuntamento</option>';box.innerHTML=`<label>Tipo di attività<select name="category">${options}</select></label><label>Descrizione<input name="description" required placeholder="Es. Corso sicurezza"></label><label>Indirizzo<input name="address" placeholder="Via, civico, città"></label><div class="row"><div><label>Dalle<input type="time" name="start" value="12:00" required></label></div><div><label>Alle<input type="time" name="end" value="13:00" required></label></div></div><label>Durata (min)<input name="duration" type="number" min="1" max="600" value="30" required></label><label>Motivazione / note<textarea name="reason" rows="2"></textarea></label><div class="feedback"></div><button type="submit">Salva attività</button><button type="button" class="cancel">Annulla</button>`;if(!lane.id){let opts=clients.map(c=>'<option value="'+String(c.id).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+String(c.name).replace(/</g,'&lt;')+'</option>').join('');box.querySelector('label').insertAdjacentHTML('beforebegin','<label>Cliente<select name="client" required>'+opts+'</select></label><label>Tipo intervento<select name="kind"><option>Rifornimento</option><option>Manutenzione</option></select></label><label>Priorità<select name="priority"><option>Normale</option><option>Alta</option><option>Urgente</option><option>Bassa</option></select></label>')}box.querySelector('.cancel').onclick=()=>box.classList.remove('open');box.onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(box).entries());if(data.start>=data.end){box.querySelector('.feedback').textContent='La fascia oraria non è valida';return}if(data.category==='Ritiro magazzino'&&!data.address.trim()){box.querySelector('.feedback').textContent='Inserisci l’indirizzo del magazzino';return}send({action:'create',target:lane.id,...data});box.querySelector('button[type=submit]').disabled=true};return box}
function draw(){root.replaceChildren();for(const lane of columns){const col=el('section','lane');const head=el('div','head');head.append(el('span','',lane.name),el('span','',String(lane.items.length)));col.append(head);const list=el('div','cards');list.dataset.target=lane.id;for(const item of lane.items){let card=el('div','card'+(item.locked?' locked':''));card.draggable=true;card.dataset.id=item.id;card.append(el('div','time',item.start+'–'+item.end+(item.locked?' · Bloccato':'')),el('div','name',item.title),el('div','meta',item.type+' · '+item.detail));card.addEventListener('dragstart',e=>{dragId=item.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.id);card.classList.add('dragging')});card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('dragging');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});list.append(card)}
function accept(e){e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect='move';list.classList.add('over')};function drop(e){e.preventDefault();e.stopPropagation();list.classList.remove('over');let id=e.dataTransfer.getData('text/plain')||dragId;if(!id)return;let source=columns.find(c=>c.items.some(x=>x.id===id));if(source&&source.id!==lane.id){let item=source.items.find(x=>x.id===id);source.items=source.items.filter(x=>x.id!==id);lane.items.push(item);lane.items.sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));draw();send({action:'move',item:id,target:lane.id})}}list.addEventListener('dragover',accept);list.addEventListener('drop',drop);list.addEventListener('dragleave',e=>{if(!list.contains(e.relatedTarget))list.classList.remove('over')});col.addEventListener('dragover',accept);col.addEventListener('drop',drop);col.append(list);let add=el('button','add',lane.id?'＋ Aggiungi attività':'＋ Nuovo appuntamento');let editor=form(lane);add.onclick=()=>{editor.classList.toggle('open');if(editor.classList.contains('open'))editor.querySelector('input[name=description]').focus()};col.append(add,editor);root.append(col)}}
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){let next=e.data.args?.columns||[];clients=e.data.args?.clients||[];let signature=JSON.stringify([next,clients]);if(signature!==lastEvent){lastEvent=signature;columns=next;draw()}window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:765},'*')}});window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:765},'*');
</script></body></html>
